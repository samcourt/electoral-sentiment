name: Validate Streamlit app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m py_compile app.py news_monitor.py kew_forecast.py campaign_signals.py ingest_vec_2022.py

      - name: Run news collector unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate news data files
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from news_monitor import FIELDS

          articles_path = Path("data/news_articles.csv")
          with articles_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames == FIELDS, (reader.fieldnames, FIELDS)
              rows = list(reader)
          assert rows, "Expected the seed news dataset to contain at least one record"
          assert all(row["article_id"] and row["source_url"] for row in rows)
          print(f"Validated {len(rows)} seeded news records with {len(FIELDS)} fields.")

          candidates_path = Path("data/kew_2026_candidates.csv")
          with candidates_path.open(encoding="utf-8-sig", newline="") as handle:
              candidates = list(csv.DictReader(handle))
          assert len(candidates) == 10, f"Expected 10 official Kew candidates, found {len(candidates)}"
          ballot_orders = [int(row["ballot_order"]) for row in candidates]
          assert sorted(ballot_orders) == list(range(1, 11)), "Candidate ballot order is incomplete or duplicated"
          assert len({row["candidate_name"] for row in candidates}) == 10, "Candidate names must be unique"

          results_path = Path("data/kew_2022_results.csv")
          with results_path.open(encoding="utf-8-sig", newline="") as handle:
              historic = list(csv.DictReader(handle))
          final_pair = [row for row in historic if row["result_measure"] == "final_preference_distribution"]
          assert len(final_pair) == 2, "Expected the 2022 final two-candidate preference pair"
          assert {row["candidate_name"] for row in final_pair} == {"Jess Wilson", "Lucy Skelton"}
          print("Validated 10 official Kew candidates and 2022 final preference distribution.")

          polls_path = Path("data/kew_polls.csv")
          with polls_path.open(encoding="utf-8-sig", newline="") as handle:
              polls = list(csv.DictReader(handle))
          assert polls, "Expected the published Kew poll record"
          assert all(row["pollster"] and row["source_url"] and row["limitations"] for row in polls)
          assert {row["poll_id"] for row in polls} == {"UCOMMS-KEW-MAR2026"}
          assert all(int(row["sample_size"]) == 914 for row in polls)
          print(f"Validated {len(polls)} reported poll-option records with methodology caveats.")

          state_poll_path = Path("data/vic_state_polls_2026.csv")
          with state_poll_path.open(encoding="utf-8-sig", newline="") as handle:
              state_polls = list(csv.DictReader(handle))
          assert len(state_polls) >= 8, "Expected a multi-poll Victorian statewide ledger"
          assert any(row["poll_id"] == "RESOLVE-NOV2026" for row in state_polls)
          assert any(row["poll_id"] == "DEMOS-NOV2026" for row in state_polls)
          for row in state_polls:
              if row["average_eligible"].lower() == "true":
                  shares = [
                      float(row[key]) for key in
                      ["alp_pct", "coalition_pct", "one_nation_pct", "greens_pct", "others_pct"]
                  ]
                  assert abs(sum(shares) - 100) < 0.11, (row["poll_id"], shares)
          print(f"Validated {len(state_polls)} Victorian statewide poll records.")

          forecast_path = Path("data/kew_external_forecast_benchmarks.csv")
          with forecast_path.open(encoding="utf-8-sig", newline="") as handle:
              external_forecasts = list(csv.DictReader(handle))
          assert any(row["candidate_name"] == "Jess Wilson" for row in external_forecasts)
          assert any(row["candidate_name"] == "Sophie Torney" for row in external_forecasts)

          pairs_path = Path("data/kew_external_2cp_benchmarks.csv")
          with pairs_path.open(encoding="utf-8-sig", newline="") as handle:
              pair_scenarios = list(csv.DictReader(handle))
          assert len(pair_scenarios) >= 7, "Expected the full set of published Kew final-pair scenarios"
          wilson_torney = [
              row for row in pair_scenarios
              if {row["final_pair_candidate_a"], row["final_pair_candidate_b"]}
              == {"Jess Wilson", "Sophie Torney"}
          ]
          assert len(wilson_torney) == 1, "Missing Wilson–Torney final-pair benchmark"
          assert abs(float(wilson_torney[0]["scenario_probability_pct"]) - 40.6) < 0.01
          torney_exposure = sum(
              float(row["scenario_probability_pct"])
              for row in pair_scenarios
              if "Sophie Torney" in {
                  row["final_pair_candidate_a"], row["final_pair_candidate_b"]
              }
          )
          assert abs(torney_exposure - 40.8) < 0.01, torney_exposure
          print(
              f"Validated {len(pair_scenarios)} AEF final-pair scenarios; "
              f"Sophie Torney finalist exposure {torney_exposure:.1f}%."
          )

          snapshot_path = Path("data/kew_forecast_snapshots.csv")
          with snapshot_path.open(encoding="utf-8-sig", newline="") as handle:
              snapshot_reader = csv.DictReader(handle)
              assert "snapshot_date" in snapshot_reader.fieldnames
          print("Validated Kew external forecast benchmark and snapshot ledger.")

          expected_headers = {
              "data/vic_campaign_donations.csv": {
                  "record_id", "donation_date", "recipient_name", "amount_aud", "electorate"
              },
              "data/vic_campaign_activity.csv": {
                  "activity_id", "activity_date", "candidate_name", "activity_type", "electorate"
              },
              "data/kalshi_market_snapshots.csv": {
                  "snapshot_at", "market_ticker", "implied_chance_pct", "volume", "open_interest"
              },
              "data/polling_methodology_notes.csv": {
                  "study_date", "source", "method_issue", "interpretation_limit", "source_url"
              },
          }
          for relative, required_fields in expected_headers.items():
              with Path(relative).open(encoding="utf-8-sig", newline="") as handle:
                  reader = csv.DictReader(handle)
                  assert reader.fieldnames, f"Missing header in {relative}"
                  assert required_fields.issubset(set(reader.fieldnames)), (
                      relative, reader.fieldnames, required_fields
                  )
          with Path("data/antony_green_notes.csv").open(encoding="utf-8-sig", newline="") as handle:
              analyst_notes = list(csv.DictReader(handle))
          assert len(analyst_notes) >= 3, "Expected curated Antony Green source notes"
          assert any(row["published_date"] == "2026-11-09" for row in analyst_notes)
          print("Validated campaign-signal ledgers and expert-analysis references.")
          PY
