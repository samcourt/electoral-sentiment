name: Validate Streamlit app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m py_compile app.py news_monitor.py ingest_vec_2022.py

      - name: Run news collector unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate news data files
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from news_monitor import FIELDS

          articles_path = Path("data/news_articles.csv")
          with articles_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames == FIELDS, (reader.fieldnames, FIELDS)
              rows = list(reader)
          assert rows, "Expected the seed news dataset to contain at least one record"
          assert all(row["article_id"] and row["source_url"] for row in rows)
          print(f"Validated {len(rows)} seeded news records with {len(FIELDS)} fields.")

          candidates_path = Path("data/kew_2026_candidates.csv")
          with candidates_path.open(encoding="utf-8-sig", newline="") as handle:
              candidates = list(csv.DictReader(handle))
          assert len(candidates) == 10, f"Expected 10 official Kew candidates, found {len(candidates)}"
          ballot_orders = [int(row["ballot_order"]) for row in candidates]
          assert sorted(ballot_orders) == list(range(1, 11)), "Candidate ballot order is incomplete or duplicated"
          assert len({row["candidate_name"] for row in candidates}) == 10, "Candidate names must be unique"

          results_path = Path("data/kew_2022_results.csv")
          with results_path.open(encoding="utf-8-sig", newline="") as handle:
              historic = list(csv.DictReader(handle))
          final_pair = [row for row in historic if row["result_measure"] == "final_preference_distribution"]
          assert len(final_pair) == 2, "Expected the 2022 final two-candidate preference pair"
          assert {row["candidate_name"] for row in final_pair} == {"Jess Wilson", "Lucy Skelton"}
          print("Validated 10 official Kew candidates and 2022 final preference distribution.")
          PY
